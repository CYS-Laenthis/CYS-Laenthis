<svg xmlns="http://www.w3.org/2000/svg" viewBox="350 65 456 315" width="912" height="630">
<style>
path { fill:#111; stroke:#111; }
@media (prefers-color-scheme: dark) {
  path { fill:#f5f5f5; stroke:#f5f5f5; }
}

/* --- LOGO ANIMATIONS --- */
.logo-wrap {
  animation: logoFloat 4s ease-in-out infinite alternate 2.2s;
}
.logo-body {
  fill-opacity: 0;
  stroke-width: 7;
  stroke-linejoin: round;
  stroke-linecap: round;
  stroke-dasharray: 3200;
  stroke-dashoffset: 3200;
  animation: drawLogo 1.6s cubic-bezier(.25,.8,.25,1) forwards, fillLogo 0.7s ease 1.2s forwards;
}
.logo-liquid {
  opacity: 0;
  animation: popItem 0.6s ease 1.35s forwards;
}
.logo-fan {
  opacity: 0;
  animation: popItem 0.6s ease 1.5s forwards;
}

/* --- TAGLINE ANIMATIONS (LETTER BY LETTER) --- */
.tag { stroke:none; opacity:0; animation: pop .25s ease forwards; }
.bang { animation: pop .25s ease forwards, wink 4s ease-in-out infinite; }

@keyframes drawLogo { to { stroke-dashoffset: 0; } }
@keyframes fillLogo { to { fill-opacity: 1; } }
@keyframes popItem { to { opacity: 1; } }
@keyframes logoFloat {
  0% { transform: translateY(0); }
  100% { transform: translateY(-7px); }
}
@keyframes pop { to { opacity: 1; } }
@keyframes wink { 0%,100% { opacity:1 } 6% { opacity:.15 } 12% { opacity:1 } }
</style>

